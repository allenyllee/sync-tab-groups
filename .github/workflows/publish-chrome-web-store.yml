name: Publish Chrome Web Store

on:
  push:
    tags:
      - "v*"

concurrency:
  group: chrome-web-store-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Test, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chrome-web-store-production

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the lockfile npm version
        run: npm install --global npm@11.8.0

      - name: Install dependencies
        run: npm ci

      - name: Install Brave
        run: |
          sudo curl -fsSLo \
            /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo \
            /etc/apt/sources.list.d/brave-browser-release.sources \
            https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Verify release version
        run: npm run release:check-version -- "$GITHUB_REF_NAME"

      - name: Run regression suite
        env:
          BRAVE_BINARY: /usr/bin/brave-browser
        run: npm run test:regression

      - name: Run lint
        run: npm run lint

      - name: Build production packages
        run: npm run release

      - name: Validate production package
        run: npm run test:release

      - name: Preserve the reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: tab-groups-resurrection-${{ github.ref_name }}
          path: release/tab-groups-resurrection-chrome.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload and submit to the Chrome Web Store
        env:
          CWS_ITEM_ID: bmjkpeefoomkdgodlecgdjjgdkoldofj
          CWS_PACKAGE_PATH: release/tab-groups-resurrection-chrome.zip
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: npm run store:publish
