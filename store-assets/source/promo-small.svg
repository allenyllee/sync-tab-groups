<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8"
                    flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="440" height="280" rx="18" fill="url(#background)"/>
  <circle cx="392" cy="25" r="150" fill="url(#glow)"/>
  <circle cx="20" cy="285" r="105" fill="#14b8a6" opacity=".10"/>

  <image x="26" y="68" width="142" height="142"
         xlink:href="tab-groups-resurrection-master.png"
         filter="url(#shadow)"/>

  <text x="190" y="92" fill="#f8fafc"
        font-family="Arial, sans-serif" font-size="25" font-weight="700">
    Tab Groups
  </text>
  <text x="190" y="126" fill="#fbbf24"
        font-family="Arial, sans-serif" font-size="25" font-weight="700">
    Resurrection
  </text>
  <text x="191" y="164" fill="#ccfbf1"
        font-family="Arial, sans-serif" font-size="14">
    Close. Restore. Keep your flow.
  </text>

  <g transform="translate(191 187)">
    <rect width="208" height="39" rx="9" fill="#ffffff" opacity=".10"/>
    <text x="14" y="25" fill="#f8fafc"
          font-family="Arial, sans-serif" font-size="13">
      Persistent groups + pinned tabs
    </text>
  </g>
</svg>
